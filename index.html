<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente Cardiometabólico</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // On page load or when changing themes, best to add inline in `head` to avoid FOUC
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* bg-gray-100 */
        }
        html.dark body {
            background-color: #111827; /* bg-gray-900 */
        }

        /* Transiciones de pantalla suaves */
        .screen {
            opacity: 0;
            transition: opacity 0.3s ease-out;
            display: none;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .screen.active {
            opacity: 1;
            display: block;
            position: relative;
        }

        /* Estilos para el indicador de riesgo (gauge) */
        .gauge {
            width: 200px;
            height: 100px;
            position: relative;
            overflow: hidden;
            margin: 0 auto;
        }
        .gauge-body {
            width: 200px;
            height: 100px;
            border-radius: 100px 100px 0 0;
            background: conic-gradient(from -90deg at 50% 100%, #10B981 0%, #34D399 30%, #F59E0B 60%, #EF4444 90%, #DC2626 100%);
            position: absolute;
            top: 0;
            left: 0;
        }
        .gauge-fill {
            position: absolute;
            top: 100%;
            left: 0;
            width: inherit;
            height: 100%;
            background: #f3f4f6; /* bg-gray-100 */
            transform-origin: center top;
            transform: rotate(var(--gauge-angle, 0deg));
            transition: transform 0.5s ease-out;
        }
        html.dark .gauge-fill {
            background: #111827; /* bg-gray-900 */
        }
        .gauge-cover {
            width: 160px;
            height: 80px;
            background: #ffffff; /* bg-white */
            border-radius: 100px 100px 0 0;
            position: absolute;
            top: 20px;
            left: 20px;
        }
        html.dark .gauge-cover {
            background: #1f2937; /* bg-gray-800 */
        }
        .gauge-value {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.875rem; /* text-3xl */
            font-weight: 700;
        }
        .gauge-label {
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.875rem; /* text-sm */
            color: #6B7280; /* text-gray-500 */
        }
        html.dark .gauge-label {
            color: #9CA3AF; /* text-gray-400 */
        }
        
        /* Animación de carga */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            animation: spin 1s linear infinite;
        }
        
        /* Estilos para los checkboxes del plan */
        input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #6B7280; /* text-gray-500 */
        }
        html.dark input[type="checkbox"]:checked + label {
            color: #4B5563; /* text-gray-600 */
        }
        
        /* Estilos para burbujas de chat */
        .chat-bubble {
            opacity: 0;
            transform: translateY(10px);
            animation: fade-in-up 0.3s ease-out forwards;
        }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Animación de "escribiendo" */
        @keyframes typing-dot {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-3px); }
        }
        .typing-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #6B7280;
            border-radius: 50%;
            margin: 0 1px;
            animation: typing-dot 1.2s infinite ease-in-out;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        /* Animación de pulso para el corazón */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        #heart-avatar {
            animation: pulse 2s infinite ease-in-out;
        }
        #heart-face-path {
            transition: d 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        /* NUEVO: Animación para Toasts */
        .animate-fade-in-up {
            animation: fade-in-up 0.5s ease-out forwards;
        }
    </style>
<script type="importmap">

}
</script>

</head>

    <div id="root"></div>

</body>
</html>
