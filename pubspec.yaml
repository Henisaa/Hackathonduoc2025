name: flutter_application_1
description: Asistente de salud cardiometabólico impulsado por IA.

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0' # Requiere Dart 3.3+ para Generative AI

dependencies:
  flutter:
    sdk: flutter

  # --- Servicios de IA ---
  google_generative_ai: ^0.4.7 # Reemplaza a @google/genai

  # --- Manejo de Estado ---
  flutter_riverpod: ^2.5.1     # Reemplaza a React State (useState, Context)
  
  # --- Almacenamiento Local ---
  shared_preferences: ^2.2.3   # Reemplaza a localStorage

  # --- Cámara ---
  camera: ^0.11.0+1            # Reemplaza a navigator.mediaDevices
  path_provider: ^2.1.3      # Para manejar rutas de archivos
  image: ^4.2.0              # Para procesar la imagen (opcional, pero útil)

  # --- UI & Utilidades ---
  go_router: ^14.2.0           # Para navegación (reemplaza 'currentScreen')
  flutter_dotenv: ^5.1.0       # Para manejar el .env (GEMINI_API_KEY)
  intl: ^0.19.0                # Para formatear fechas (como toLocaleTimeString)
  json_annotation: ^4.9.0      # Para serialización de modelos

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Generación de código ---
  build_runner: ^2.4.10         # Para auto-generar código de JSON
  json_serializable: ^6.8.0  # Para auto-generar fromJson/toJson

flutter:
  uses-material-design: true
  
  # Asegúrate de cargar tu archivo .env
  assets:
    - .env