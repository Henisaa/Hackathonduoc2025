name: flutter_application_1
description: Asistente de salud cardiometabólico impulsado por IA.

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Servicios de IA (no usados en modo offline, pero disponibles) ---
  google_generative_ai: ^0.4.7

  # --- Estado y navegación ---
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # --- Persistencia y utilidades ---
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.10
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - .env
